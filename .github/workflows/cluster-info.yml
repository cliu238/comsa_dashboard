name: cluster-info

# TEMPORARY, read-only. Dispatched once to learn what storage the k8s-dev cluster
# offers, so backend-deployment.yaml can mount a PersistentVolumeClaim (issue #110).
# Deleted after use. Only reads cluster state; applies nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.K8S_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Query cluster storage
        env:
          SSH_AUTH_SOCK: ${{ env.SSH_AUTH_SOCK }}
        run: |
          ssh -A -o StrictHostKeyChecking=no cliu238@dslogin01.pha.jhu.edu \
            'ssh -A -p 14132 -o StrictHostKeyChecking=no k8slgn.idies.jhu.edu bash -s' << 'EOF'
          export KUBECONFIG=/var/k8s/users/cliu238/k8s-dev-comsa-dashboard-admins.conf
          echo "===== STORAGE CLASSES ====="
          kubectl get storageclass -o custom-columns='NAME:.metadata.name,PROVISIONER:.provisioner,DEFAULT:.metadata.annotations.storageclass\.kubernetes\.io/is-default-class,RECLAIM:.reclaimPolicy,BINDMODE:.volumeBindingMode' 2>&1
          echo
          echo "===== EXISTING PVCs IN NAMESPACE ====="
          kubectl get pvc -n comsa-dashboard 2>&1
          echo
          echo "===== RESOURCEQUOTA / LIMITS (storage caps?) ====="
          kubectl get resourcequota -n comsa-dashboard 2>&1
          echo
          echo "===== CURRENT PODS ====="
          kubectl get pods -n comsa-dashboard 2>&1
          echo
          echo "===== CAN I CREATE A PVC? (dry-run, creates nothing) ====="
          cat <<'PVC' | kubectl apply --dry-run=server -f - 2>&1
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: comsa-probe-dryrun
            namespace: comsa-dashboard
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
          PVC
          EOF
