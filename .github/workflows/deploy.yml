name: Deploy to k8s-dev

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_backend_rebuild:
        description: "Rebuild the backend image with no layer cache and diff its package manifest — the reproducibility proof for issue #123"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
          frontend:
            - 'frontend/**'

  build-and-push:
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    # The backend keeps the GitHub Actions layer cache for ordinary pushes because a
    # cold build recompiles the vacalibration Stan models from source — the slowest
    # layer in the image. The cache-free path below is opt-in, for exactly the case
    # where the reproducibility proof needs every package re-resolved from the pinned
    # snapshot on a fresh runner (issue #123).
    - name: Build and push backend image
      id: build-backend
      if: needs.check-changes.outputs.backend == 'true' || inputs.force_backend_rebuild
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        no-cache: ${{ inputs.force_backend_rebuild || false }}

    # Proves reproducibility (issue #123): pulls the image back by its immutable
    # digest (never a mutable tag, which could race a concurrent push), extracts
    # the package manifest baked in by backend/Dockerfile, sanity-checks its shape
    # so a truncated/empty capture can't pass vacuously, then diffs it against the
    # committed golden copy. Advisory until backend/package-manifest.csv exists
    # (bootstrap); blocking after that.
    - name: Verify backend package manifest (issue #123)
      id: verify-manifest
      if: steps.build-backend.outcome == 'success'
      run: |
        set -euo pipefail
        IMAGE="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}@${{ steps.build-backend.outputs.digest }}"

        docker pull "$IMAGE"
        docker run --rm "$IMAGE" cat /opt/package-manifest.csv > actual-package-manifest.csv

        # Guard against a vacuous pass: reject an empty, malformed, or truncated capture.
        if [ ! -s actual-package-manifest.csv ]; then
          echo "Manifest extraction produced an empty file" >&2
          exit 1
        fi
        HEADER="$(head -n1 actual-package-manifest.csv)"
        if [ "$HEADER" != "Package,Version" ]; then
          echo "Manifest header is '$HEADER', expected 'Package,Version'" >&2
          exit 1
        fi
        ROWS=$(($(wc -l < actual-package-manifest.csv) - 1))
        if [ "$ROWS" -le 100 ]; then
          echo "Manifest has only $ROWS package rows, expected > 100 (extraction likely failed)" >&2
          exit 1
        fi

        {
          echo "### Backend package manifest (issue #123)"
          echo "$ROWS packages extracted from \`$IMAGE\`"
          echo ""
          echo "| Package | Version |"
          echo "|---|---|"
          for pkg in vacalibration EAVA openVA sodium plumber jose pool knitr rstan RcppParallel RPostgres uuid future jsonlite rJava; do
            grep "^${pkg}," actual-package-manifest.csv | awk -F, -v p="$pkg" '{print "| " p " | " $2 " |"}'
          done
        } >> "$GITHUB_STEP_SUMMARY"

        if [ ! -f backend/package-manifest.csv ]; then
          {
            echo ""
            echo "**No committed manifest yet.** Download the \`backend-package-manifest\` artifact"
            echo "from this run and commit it to \`backend/package-manifest.csv\` — after that,"
            echo "this check becomes blocking."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        if ! diff -u backend/package-manifest.csv actual-package-manifest.csv > manifest.diff; then
          {
            echo ""
            echo "### Build is no longer reproducible"
            echo "The installed package set drifted from the committed \`backend/package-manifest.csv\`."
            echo "Likely cause: the \`CRAN_SNAPSHOT\` ENV in \`backend/Dockerfile\` changed, or the"
            echo "pinned base image digest changed."
            echo '```diff'
            cat manifest.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Manifest matches \`backend/package-manifest.csv\` — build is reproducible." >> "$GITHUB_STEP_SUMMARY"

    - name: Upload backend package manifest
      if: always() && steps.build-backend.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: backend-package-manifest
        path: actual-package-manifest.csv

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend image
      if: needs.check-changes.outputs.frontend == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        no-cache: true

  deploy:
    needs: [check-changes, build-and-push]
    if: always() && needs.build-and-push.result != 'failure'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Decode and setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.K8S_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        # Verify key
        echo "SSH key fingerprint:"
        ssh-keygen -lf ~/.ssh/id_rsa

        # Start ssh-agent and add key
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_rsa

        # Save agent socket to GitHub environment
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

        # Verify key in agent
        echo "Keys in SSH agent:"
        ssh-add -l

    - name: Deploy to k8s via SSH
      env:
        SSH_AUTH_SOCK: ${{ env.SSH_AUTH_SOCK }}
      run: |
        # SSH to k8s with agent forwarding and apply manifests
        ssh -A -o StrictHostKeyChecking=no cliu238@dslogin01.pha.jhu.edu \
          'ssh -A -p 14132 -o StrictHostKeyChecking=no k8slgn.idies.jhu.edu bash -s' << 'EOF'
        export KUBECONFIG=/var/k8s/users/cliu238/k8s-dev-comsa-dashboard-admins.conf

        # Clone/update repository
        cd ~
        if [ -d "comsa_dashboard" ]; then
          cd comsa_dashboard && git pull
        else
          git clone https://github.com/cliu238/comsa_dashboard.git && cd comsa_dashboard
        fi

        # Apply manifests
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
        kubectl apply -f k8s/ingress.yaml

        # Force restart deployments to pull latest images
        kubectl rollout restart deployment/comsa-backend -n comsa-dashboard
        kubectl rollout restart deployment/comsa-frontend -n comsa-dashboard

        # Wait for rollout
        kubectl rollout status deployment/comsa-backend -n comsa-dashboard --timeout=5m
        kubectl rollout status deployment/comsa-frontend -n comsa-dashboard --timeout=5m

        # Show status
        kubectl get pods -n comsa-dashboard
        kubectl get ingress -n comsa-dashboard
        EOF

    - name: Deployment complete
      run: |
        echo "✅ Deployment successful!"
        echo "🌐 Frontend: https://dev.sites.idies.jhu.edu/comsa-dashboard"
        echo "🔧 Backend API: https://dev.sites.idies.jhu.edu/comsa-dashboard/api/health"
